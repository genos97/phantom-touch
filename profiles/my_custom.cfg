# Scrcpy Keymapper Pro v3 Profile
# All coordinates are normalized (0.0 = top/left, 1.0 = bottom/right)
# Press F2 in-app to drag & drop nodes, T to cycle node Action Type, Ctrl+S to save.

name = my_custom
scrcpy_args = --max-fps=90 --video-bit-rate=16M
control_max_size = 0
poll_hz = 0
toggle_aim_key = TILDE
hold_unlock_key = NONE
reset_touch_key = F5
show_hud_in_play = 1
hud_opacity = 0.75
float_btn_x = 0.0320
float_btn_y = 0.2800
panel_x = 0.2600
panel_y = 0.1000

# --- Aim, View Stack & Free Fire Counter-Acceleration Physics ---
aim_x = 0.6200
aim_y = 0.7000
aim_half_w = 0.1600
aim_half_h = 0.6400
unbounded_aim = 1
invert_y = 0
ff_counter_accel = 7.00
sens_x = 0.950
sens_y = 0.950
fire_sens_x = 0.800
fire_sens_y = 1.250
scope_sens_x = 0.650
scope_sens_y = 0.750
accel_power = 1.000
accel_ref_speed = 14.00
accel_cap = 2.00
smoothing = 0.100
idle_reset_ms = 700
touch_down_delay_ms = 15
touch_up_delay_ms = 0
tap_jitter_px = 4

# --- Fire Button (0 = DRAG-FIRE Right, 1 = CLAW-LEFT Separate, 2 = DUAL-DRAG) ---
fire_mode = 1
fire_key = LMB
fire_x = 0.8510
fire_y = 0.7280
fire_box_half_w = 0.3500
fire_box_half_h = 0.7200
left_fire_x = 0.2360
left_fire_y = 0.4280

# --- WASD Virtual Joystick (with Free Fire 3-Stage Stepped Glide + Sprint/Walk Radius) ---
joy_x = 0.1620
joy_y = 0.7500
joy_radius = 0.0850
joy_sprint_radius = 0.1600
joy_walk_radius = 0.0420
joy_stepped_glide = 1
joy_up = W
joy_down = S
joy_left = A
joy_right = D
joy_sprint = LSHIFT
joy_walk = LCTRL

# --- Action Nodes: LABEL, KEY[or K1+K2], X, Y, ACTION, SCOPE_SENS(0/1), DUR_MS[, X2, Y2] ---
# Actions: PRESS, CLICK, DOWN_UP, UP_TRIGGER, HOLD_VIEW, SWIPE, CURSOR_TOGGLE, RESET_VIEW, SWITCH_SENS, REACTIVATE_JOY
button = SCOPE, RMB, 0.9310, 0.4950, PRESS, 1, 35
button = JUMP, SPACE, 0.9410, 0.6580, PRESS, 0, 35
button = CROUCH, Q, 0.8830, 0.8920, PRESS, 0, 35
button = PRONE, Z, 0.7930, 0.8920, PRESS, 0, 35
button = RELOAD, LMB, 0.8800, 0.0850, CLICK, 0, 35
button = GLOO, E, 0.2700, 0.8550, PRESS, 0, 35
button = MEDKIT, 4, 0.0810, 0.6480, CLICK, 0, 35
button = WPN1, 1, 0.9197, 0.0836, CLICK, 0, 35
button = WPN2, 2, 0.8400, 0.2150, CLICK, 0, 35
button = MELEE, 3, 0.9320, 0.2150, CLICK, 0, 35
button = SWITCH, Q, 0.7700, 0.0850, CLICK, 0, 35
button = LOOT, F, 0.7200, 0.3400, CLICK, 0, 35
button = SPRINT, E, 0.1280, 0.4220, CLICK, 0, 35
button = USE, G, 0.6500, 0.6700, PRESS, 0, 35
button = FREELOOK, LALT, 0.7750, 0.2750, HOLD_VIEW, 0, 35
button = BAG, LSHIFT, 0.0556, 0.4933, CURSOR_TOGGLE, 0, 35
button = MAP, M, 0.0950, 0.1400, CURSOR_TOGGLE, 0, 35
button = RSTVIEW, V, 0.5000, 0.1500, RESET_VIEW, 0, 35
